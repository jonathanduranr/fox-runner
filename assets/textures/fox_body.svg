<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120">
  <defs>
    <!-- Paleta cálida y mate del zorrito -->
    <linearGradient id="foxOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F38038"/>
      <stop offset="100%" stop-color="#D75A1A"/>
    </linearGradient>
    <linearGradient id="earInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCEAE6"/>
      <stop offset="100%" stop-color="#F7C4BB"/>
    </linearGradient>
  </defs>

  <!-- 1. Oreja Trasera (más oscura para dar profundidad 3D) -->
  <path d="M 98 42 L 105 14 C 107 10, 114 12, 115 16 L 118 42 Z" fill="#BA4610"/>
  <path d="M 102 38 L 107 18 C 108 16, 112 16, 113 19 L 115 38 Z" fill="#E8967A"/>

  <!-- 2. Torso del Zorrito (Curva suave y redondeada) -->
  <path d="M 38 68 C 38 52, 60 48, 86 52 C 98 54, 105 60, 102 74 C 98 86, 78 88, 52 86 C 40 85, 38 78, 38 68 Z" fill="url(#foxOrange)"/>

  <!-- 3. Pecho y Vientre Blanco Esponjoso -->
  <path d="M 72 58 C 88 58, 104 64, 102 78 C 98 88, 76 86, 62 82 C 60 72, 64 62, 72 58 Z" fill="#FFFFFF"/>

  <!-- 4. Cabeza Redondita y Tierna -->
  <!-- Cráneo redondeado (no triangular ni alargado) -->
  <path d="M 92 48 C 92 32, 110 26, 126 34 C 138 40, 142 52, 134 64 C 124 74, 102 72, 94 62 C 92 58, 92 53, 92 48 Z" fill="url(#foxOrange)"/>

  <!-- 5. Mejilla y Barba Blanca Fluffy (Mechón hacia atrás) -->
  <path d="M 112 50 C 124 50, 138 58, 134 65 C 126 72, 110 70, 100 68 C 98 60, 104 52, 112 50 Z" fill="#FFFFFF"/>

  <!-- 6. Hociquito Corto y Dulce -->
  <path d="M 126 46 C 134 46, 144 50, 144 55 C 144 58, 136 62, 128 62 C 124 62, 122 54, 126 46 Z" fill="#FFFFFF"/>
  <path d="M 124 45 C 132 44, 142 48, 142 53 C 138 55, 130 54, 124 52 Z" fill="url(#foxOrange)"/>

  <!-- 7. Naricita de Botón -->
  <ellipse cx="143" cy="52.5" rx="3" ry="2.5" fill="#2C3437"/>
  <circle cx="142" cy="51.5" r="0.8" fill="#FFFFFF"/>

  <!-- 8. Oreja Delantera (Grande, perky y expresiva) -->
  <path d="M 108 40 L 118 10 C 120 6, 128 8, 129 13 L 132 40 Z" fill="url(#foxOrange)"/>
  <path d="M 112 36 L 120 15 C 121 13, 125 14, 126 17 L 128 36 Z" fill="url(#earInner)"/>
  <!-- Pelo blanco en la base de la oreja -->
  <path d="M 108 40 C 112 34, 118 36, 122 39 C 116 41, 112 42, 108 40 Z" fill="#FFFFFF"/>

  <!-- 9. Ojo Grande, Tierno y Brillante (Estilo Kawaii / Disney) -->
  <ellipse cx="121" cy="46" rx="6" ry="7" fill="#242B2E"/>
  <ellipse cx="121" cy="47" rx="5" ry="5.5" fill="#4A3525"/>
  <circle cx="121" cy="46" r="4" fill="#1A1F21"/>
  <!-- Brillos mágicos en el ojo -->
  <circle cx="122.5" cy="43.5" r="2.2" fill="#FFFFFF"/>
  <circle cx="119" cy="48" r="1.1" fill="#FFFFFF"/>

  <!-- 10. Sonrojo Rosado en la Mejilla -->
  <ellipse cx="114" cy="56" rx="4.5" ry="3" fill="#F1948A" opacity="0.6"/>

  <!-- 11. Sonrisa Dulce -->
  <path d="M 132 58 C 134 60, 138 60, 140 58" stroke="#8A3414" stroke-width="1.8" stroke-linecap="round" fill="none"/>
</svg>
