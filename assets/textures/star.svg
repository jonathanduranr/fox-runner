<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Soft warm glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F9E79F" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#F39C12" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F39C12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5CC"/>
      <stop offset="50%" stop-color="#F1C40F"/>
      <stop offset="100%" stop-color="#E67E22"/>
    </linearGradient>
  </defs>

  <!-- Halo -->
  <circle cx="32" cy="32" r="28" fill="url(#starGlow)"/>

  <!-- Minimalist Clean 4-Point Sparkle Star -->
  <path d="M 32 8 C 33 22, 42 31, 56 32 C 42 33, 33 42, 32 56 C 31 42, 22 33, 8 32 C 22 31, 31 22, 32 8 Z" fill="url(#starGrad)"/>

  <!-- Center Highlight -->
  <circle cx="32" cy="32" r="3" fill="#FFFFFF"/>
</svg>
